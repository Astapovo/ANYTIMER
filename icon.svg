<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="100%" stop-color="#0d0d19" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71f8e4" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(79,219,200,0.25)" stroke-width="8" />
  
  <!-- Outer Ring with Glow -->
  <circle cx="256" cy="270" r="150" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="20" />
  <circle cx="256" cy="270" r="150" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="942" stroke-dashoffset="280" filter="url(#glow)" />
  
  <!-- Top button / crown -->
  <rect x="232" y="70" width="48" height="32" rx="8" fill="url(#accentGrad)" />
  <rect x="246" y="102" width="20" height="22" fill="#71f8e4" />
  
  <!-- Side buttons -->
  <rect x="110" y="125" width="24" height="12" rx="4" transform="rotate(-35 110 125)" fill="rgba(255,255,255,0.3)" />
  <rect x="385" y="110" width="24" height="12" rx="4" transform="rotate(35 385 110)" fill="rgba(79,219,200,0.6)" />
  
  <!-- Clock Hands -->
  <circle cx="256" cy="270" r="16" fill="#71f8e4" />
  <line x1="256" y1="270" x2="256" y2="175" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="270" x2="330" y2="270" stroke="#71f8e4" stroke-width="10" stroke-linecap="round" />
  
  <!-- Subtle Grid Dots -->
  <circle cx="256" cy="145" r="4" fill="#71f8e4" />
  <circle cx="381" cy="270" r="4" fill="#71f8e4" />
  <circle cx="256" cy="395" r="4" fill="#71f8e4" />
  <circle cx="131" cy="270" r="4" fill="#71f8e4" />
</svg>